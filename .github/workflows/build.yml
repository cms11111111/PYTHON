name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        # 修正：使用存在的 flet 版本
        # 0.22.1 是一個穩定且相容性較好的版本
        pip install flet==0.22.1

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # 搭配 flet 0.22.x 的建議 Flutter 版本
        flutter-version: '3.19.6'
        channel: 'stable'

    - name: Build APK
      run: |
        cd MyPythonProject
        rm -rf pubspec.yaml android ios build
        
        # 舊版 Flet 的 build 指令
        flet build apk --verbose
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: MyPythonProject/build/apk/app-release.apk