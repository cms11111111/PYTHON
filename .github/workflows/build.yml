name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install flet
        # 暫時不安裝 pandas，確保先能打包成功
        # 我們會修改 main.py 來處理沒有 pandas 的情況

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Build APK
      run: |
        # 進入正確的目錄
        cd MyPythonProject
        
        # 確保刪除之前的 build 資料夾 (如果有的話)
        rm -rf build

        # 開始打包，加上 -vv 看詳細資訊
        flet build apk -vv --include-packages flet

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: MyPythonProject/build/apk/app-release.apk