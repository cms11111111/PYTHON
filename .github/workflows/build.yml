name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install flet
        # 安裝 flet 相關工具
        pip install -U flet

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Build APK
      run: |
        cd MyPythonProject
        
        # 關鍵修正：先明確初始化 flet 專案，避免打包時問問題
        # 使用 --template app 建立標準結構
        flet create . --template app --description "Money Tracker App" --org "com.example" --project "MoneyTracker" --no-interaction
        
        # 開始打包，加上 --verbose 看詳細
        flet build apk --verbose

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: MyPythonProject/build/apk/app-release.apk
