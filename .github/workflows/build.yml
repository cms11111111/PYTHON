name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install flet
        pip install -U flet

    # 移除手動安裝 Flutter 的步驟
    # 讓 Flet 自己去處理它想要的版本

    - name: Build APK
      run: |
        cd MyPythonProject
        rm -rf pubspec.yaml android ios build
        
        # 讓 yes 自動回答所有問題 (包括下載 Flutter 的詢問)
        yes | flet build apk --verbose
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: MyPythonProject/build/apk/app-release.apk