name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install flet
        pip install -U flet

    # 這次我們安裝較新的 Flutter 版本，嘗試滿足 Flet 的需求
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0' # 嘗試使用較新的穩定版
        channel: 'stable'

    - name: Build APK
      run: |
        cd MyPythonProject
        rm -rf pubspec.yaml android ios build
        
        # 讓 yes 指令重複輸出 y，確保多次詢問都能回答
        # 並使用 --no-input 參數 (如果支援的話)
        yes | flet build apk --verbose
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: MyPythonProject/build/apk/app-release.apk
