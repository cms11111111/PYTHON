name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 安裝 Buildozer 依賴
      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3 \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libltdl-dev \
            libffi-dev \
            autoconf \
            libtool \
            pkg-config

      # 2. 安裝 Buildozer
      - name: Install Buildozer
        run: |
          pip3 install --upgrade buildozer "cython==0.29.36" virtualenv

      # 2.5. 手動安裝 Android SDK (修正路徑錯誤)
      - name: Setup Android SDK
        run: |
          # 定義路徑
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          # 下載 Command Line Tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          
          # 關鍵步驟：移動到 latest 子目錄
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          # [修正] 建立 tools 目錄連結，欺騙 Buildozer
          # Buildozer 舊邏輯會找 tools/bin/sdkmanager
          cp -r $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
          
          # 接受授權
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          
          # 安裝必要的 Build Tools 和 Platform
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      # 3. 開始打包
      - name: Build with Buildozer
        run: |
          export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
          buildozer android debug

      # 4. 上傳打包好的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyTracker-APK
          path: bin/*.apk
