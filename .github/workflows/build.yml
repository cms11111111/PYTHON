name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install flet
        pip install -U flet

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Build APK
      run: |
        cd MyPythonProject
        
        # 刪除可能導致衝突的設定檔
        rm -rf pubspec.yaml android ios build
        
        # 使用 yes 指令，對所有詢問自動回答 "y"
        # 這是 Linux 下解決互動式問答的終極手段
        yes | flet build apk --verbose

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: MyPythonProject/build/apk/app-release.apk