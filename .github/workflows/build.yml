name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        # 指定安裝舊版 Flet，避免新版強制檢查 Flutter 版本的囉唆問題
        pip install flet==0.21.0

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # 配合舊版 Flet，使用當時的 Flutter 版本
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Build APK
      run: |
        cd MyPythonProject
        rm -rf pubspec.yaml android ios build
        
        # 舊版 Flet 的 build 指令比較單純
        flet build apk --verbose
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: MyPythonProject/build/apk/app-release.apk
