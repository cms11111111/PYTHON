name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 安裝 Buildozer 依賴
      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3 \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libltdl-dev \
            libffi-dev \
            autoconf \
            libtool \
            pkg-config

      # 2. 安裝 Buildozer
      - name: Install Buildozer
        run: |
          pip3 install --upgrade buildozer cython virtualenv

      # 2.5. 預先建立 Android SDK License 檔案 (修正 License 同意問題)
      - name: Pre-accept Android SDK Licenses
        run: |
          # 建立 Buildozer 預設的 SDK 路徑結構
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # 寫入常見的 License hash (這是 Google 的標準授權碼)
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # 其他可能需要的 license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      # 3. 開始打包
      - name: Build with Buildozer
        run: |
          # 仍然保留 yes | 以防萬一，但主要依賴上面的 license 檔
          yes | buildozer android debug

      # 4. 上傳打包好的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyTracker-APK
          path: bin/*.apk
